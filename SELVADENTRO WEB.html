<!DOCTYPE html>
<html lang="es">
<head>

<link href="https://api.mapbox.com/mapbox-gl-js/v3.16.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.16.0/mapbox-gl.js"></script>
<link href="https://cdn.jsdelivr.net/gh/jscastro76/threebox@v.2.2.2/dist/threebox.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/gh/jscastro76/threebox@v.2.2.2/dist/threebox.min.js"></script>
<script src="https://unpkg.com/scrollama"></script>

<style>
/* ══════════════════════════════════════════════════════════════════════
   BASE (original look preserved)
   ══════════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box}
:root{--font:"Courier Prime","Courier New",monospace;--font-head:"Archivo","Helvetica Neue",Arial,sans-serif}
body{margin:0;padding:0;background:#000;font-family:var(--font)}
button,input,textarea{font-family:var(--font)}
h1,h2,h3,.value,.amenity-value,.topButton,.btn-gold,.btn-line,.kpi b,.stat b,.rp-tools button,#reportButton,#reserveBtn,#sendReserveBtn,#fichaBtn,#exploreBtn,.s-head b,.modal h3{font-family:var(--font-head)}
body.interactive,body.locked{overflow:hidden}
body.narrative{overflow-x:hidden}
#map{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
body.narrative #map .mapboxgl-canvas-container{pointer-events:none}

/* ─── Top buttons (original) ─────────────────────────────────────────── */
.topButton{ position:fixed;padding:7px 15px; background:rgba(0,0,0,0.65);color:white; font-weight:bold;font-size:11px;border:1.8px solid white;border-radius:30px; cursor:pointer;backdrop-filter:blur(12px);box-shadow:0 6px 20px rgba(0,0,0,0.7); transition:all .3s;z-index:2147483000;pointer-events:none; display:none;align-items:center;justify-content:center;gap:6px; min-width:60px; }
body.interactive .topButton{display:flex}
.topButton::before{content:"";position:absolute;inset:-10px;pointer-events:auto;}
.topButton:hover{background:rgba(255,255,255,0.25)}
.topButton.active{ background:rgba(255,255,255,0.85) !important; color:black !important; }
.topButton img.icon{height:22px;opacity:0.9;}
.topButton svg{width:18px;height:18px;fill:currentColor}
#treesButton{left:20px;top:12px;}
#darkButton{left:92px;top:12px;}
#strategiesButton{left:20px;top:62px;}
#statusButton{right:12px;top:12px;}
#areaButton{right:12px;top:70px;}
#amenitiesButton{right:12px;top:128px;}
#clusterButton{right:12px;top:186px;}
#treesButton, #darkButton, #strategiesButton { padding:5.25px 11.25px !important; min-width:45px !important; }
#treesButton img.icon, #darkButton img.icon { height:16.5px !important; }
@media(max-width:767px){
  .topButton{ padding:6px 12px;font-size:10px;border:1.5px solid white; min-width:54px; }
  .topButton img.icon{height:19px;}
  #treesButton{left:8px;top:8px;} #darkButton{left:70px;top:8px;} #strategiesButton{left:8px;top:52px;}
  #statusButton{right:8px;top:8px;} #areaButton{right:8px;top:62px;} #amenitiesButton{right:8px;top:116px;} #clusterButton{right:8px;top:170px;}
  #treesButton, #darkButton, #strategiesButton { padding:4.5px 9px !important; min-width:40px !important; }
  #treesButton img.icon, #darkButton img.icon { height:14px !important; }
}
#reportButton{ position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:2147483000;padding:6px 14px;
  background:rgba(0,0,0,0.45);color:rgba(255,255,255,0.75);font-size:9.5px;font-weight:bold;letter-spacing:.14em;
  border:1px solid rgba(255,255,255,0.35);border-radius:30px;cursor:pointer;backdrop-filter:blur(10px);display:none;transition:all .3s;font-family:inherit }
#reportButton:hover{background:rgba(255,255,255,0.25);color:#fff}
body.interactive #reportButton{display:block}

/* ─── Strategy menu (behind the lightbulb) ───────────────────────────── */
#strategyBar{position:fixed;left:20px;top:112px;z-index:2147483000;display:none;flex-direction:column;gap:10px}
body.interactive #strategyBar.show{display:flex}
.stile{width:46px;height:46px;border-radius:12px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.45);transform:translateX(-14px);opacity:0;animation:tileIn .45s ease forwards;position:relative;padding:0}
.stile svg{width:26px;height:26px;fill:#fff}
.stile:hover{filter:brightness(1.1);transform:scale(1.06)!important}
.stile::after{content:attr(data-label);position:absolute;left:56px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.8);color:#fff;font-size:10px;font-weight:bold;
  letter-spacing:.12em;padding:5px 10px;border-radius:20px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.stile:hover::after{opacity:1}
@keyframes tileIn{to{transform:none;opacity:1}}
@media(max-width:767px){ #strategyBar{left:8px;top:98px;gap:8px} .stile{width:40px;height:40px} .stile svg{width:22px;height:22px} .stile::after{display:none} }

/* ─── Legend (dynamic) ───────────────────────────────────────────────── */
#areaLegend{ position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:2000; background:rgba(0,0,0,0.9);color:white;padding:8px 12px;border-radius:12px; font-size:11px;font-weight:bold;backdrop-filter:blur(12px); box-shadow:0 6px 20px rgba(0,0,0,0.7);display:none; max-width:95vw;white-space:nowrap;overflow-x:auto; }
#areaLegend .legend-row{display:flex;gap:12px;justify-content:center;align-items:center;}
#areaLegend .item{display:flex;align-items:center;gap:6px;}
#areaLegend span{display:inline-block;width:16px;height:16px;border-radius:3px;flex-shrink:0;}

/* ─── Info box (original) ────────────────────────────────────────────── */
#infoBox{ position:fixed;background:rgb(67,81,63);color:white;padding:26px 22px; border-radius:32px; box-shadow:0 10px 40px rgba(0,0,0,0.7);z-index:1000;max-width:90%;width:380px; transition:all .35s ease;opacity:0;visibility:hidden; transform:translateY(20px);overflow:hidden; }
#infoBox.visible{opacity:.92;visibility:visible;transform:translateY(0)}
body.dark-mode #infoBox{background:rgba(40,55,38,0.95);}
@media(min-width:768px){ #infoBox{top:55px;left:30px;max-height:95vh;overflow-y:auto;} }
@media(max-width:767px){ #infoBox{ left:50%;bottom:0;transform:translateX(-50%) translateY(100%); width:100%;max-width:none; border-radius:32px 32px 0 0; padding-top:60px;padding-bottom:80px; height:auto;max-height:30vh; } #infoBox.visible{ transform:translateX(-50%) translateY(0); bottom:0; top:auto !important; } }
.infoBoxContent{ max-height:100%;overflow-y:auto;padding-right:8px;-webkit-overflow-scrolling:touch; }
@media(max-width:767px){ .infoBoxContent{ margin-top:-20px; padding-bottom:120px; } }
.metadata-block{margin-bottom:18px;text-align:center}
.label{font-size:14px;opacity:.85;margin-bottom:4px}
.value{font-size:22px;font-weight:bold}
.amenity-value{font-size:32px;font-weight:bold;text-transform:uppercase;}
#metaDesc{font-size:14px;line-height:1.6;opacity:.9;text-align:center;margin:8px 0 0;display:none}
.amenity-image{ width:100%; max-width:420px; margin:28px auto 0; display:block; border-radius:16px; box-shadow:0 8px 25px rgba(0,0,0,0.5); cursor:zoom-in; transition:transform .3s; }
.amenity-image:hover{transform:scale(1.05);}
#fullscreenOverlay{ position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.95); display:flex;justify-content:center;align-items:center;z-index:9999;visibility:hidden;opacity:0; transition:opacity .4s ease;cursor:zoom-out; }
#fullscreenOverlay.visible{visibility:visible;opacity:1;}
#fullscreenImage{ max-width:95vw; max-height:95vh; object-fit:contain; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,0.8); }
.areaConstContainer{ display:flex;justify-content:center;gap:50px;margin:20px 0; }
.priceEstadoContainer{ display:flex;flex-direction:column;align-items:center;margin:20px 0 30px; }
#metaPrecio { text-align:center; cursor:pointer; }
#reserveSection{ margin:30px auto 0;max-width:320px;width:100%; }
#reserveBtn, #sendReserveBtn, #fichaBtn{ width:100%;padding:16px; background:#D4AF37 !important;color:white !important; font-weight:bold;font-size:18px;border:none;border-radius:30px;cursor:pointer; box-shadow:0 6px 20px rgba(212,175,55,0.6); transition:all .3s; display:block;text-align:center;text-decoration:none;font-family:inherit }
#fichaBtn{ background:rgba(255,255,255,0.14) !important; border:1.5px solid rgba(255,255,255,0.7) !important; box-shadow:none; font-size:15px; margin-top:12px; display:none; }
#reserveBtn:hover, #sendReserveBtn:hover{background:#e0c35a !important;transform:translateY(-3px);}
#fichaBtn:hover{background:rgba(255,255,255,0.28) !important;transform:translateY(-3px);}
.reserveForm input{ width:100%;padding:12px 14px;margin:10px 0;border-radius:12px;border:1px solid #ccc; font-size:15px;background:#fff;box-sizing:border-box; }
.thankYou{ padding:20px;font-size:17px;color:#0b8b0b;background:#f0fff0;border-radius:12px; margin:30px auto 0;max-width:320px;text-align:center;display:none; }
.infoLogoBig{ width:48%;max-width:180px;margin:36px auto 16px;display:block;opacity:.95; }
@media(max-width:767px){ .infoLogoBig{width:68%;max-width:240px;} }
.smallLogoContainer{display:flex;justify-content:center;gap:32px;margin-top:18px}
.smallLogo{height:26px;opacity:.9;cursor:pointer;transition:opacity .3s;}
.smallLogo:hover{opacity:1;}
@media(max-width:767px){ #logosSection { opacity: 0; transition: opacity 0.8s ease; margin-top: 60px; padding-top: 30px; border-top: 1px solid rgba(255,255,255,0.15); pointer-events: none; } #logosSection.visible { opacity: 1; pointer-events: auto; } }
@media(min-width:768px){ #logosSection { opacity: 1 !important; } }

/* ─── Intro logo ─────────────────────────────────────────────────────── */
#splash{ position:fixed;inset:0;z-index:5000;display:flex;align-items:center;justify-content:center;pointer-events:none;background:#000;transition:opacity 1.6s ease }
#splash img{ width:440px;max-width:80vw;opacity:0;transform:scale(.94);transition:opacity 2s ease,transform 2s ease }
#splash.in img{opacity:1;transform:scale(1)}
#splash.fade img{opacity:0;transform:scale(1.03)}
#splash.out{opacity:0}
#scrollHint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:4500;color:#fff;font-size:10px;letter-spacing:.24em;font-weight:bold;opacity:0;transition:opacity 1s;pointer-events:none;text-align:center}
#scrollHint.show{opacity:.85}
#scrollHint i{display:block;width:1px;height:34px;margin:10px auto 0;background:linear-gradient(#fff,transparent);animation:hint 1.6s infinite}
@keyframes hint{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
#loader{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:5001;color:#fff;font-size:10px;letter-spacing:.2em;font-weight:bold;background:rgba(0,0,0,.6);padding:8px 16px;border-radius:30px;border:1px solid rgba(255,255,255,.4);transition:opacity .6s}
#loader.hide{opacity:0}
#progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent,#D4AF37);z-index:4000;transition:width .15s linear}
body.interactive #progress{display:none}

/* ─── Stories (shared by the main story and the 6 strategies) ────────── */
.story{position:relative;z-index:10;pointer-events:none;display:none;--accent:#D4AF37}
.story.on{display:block}
.step{min-height:100vh;display:flex;align-items:center;padding:0 5vw}
.step:nth-child(even){justify-content:flex-end}
.step.left{justify-content:flex-start!important}
.step.right{justify-content:flex-end!important}
.step.center{justify-content:center!important}
.card{pointer-events:auto;max-width:460px;width:100%;background:rgba(245,245,243,0.97);color:#1f1f1f;backdrop-filter:blur(16px);border-radius:6px;
  padding:34px 36px;box-shadow:0 14px 50px rgba(0,0,0,0.45);opacity:.7;transform:translateY(12px);transition:opacity 1.1s cubic-bezier(.25,.1,.25,1),transform 1.1s cubic-bezier(.25,.1,.25,1);border:1px solid rgba(0,0,0,.06)}
.card.wide{max-width:640px}
.step.is-active .card{opacity:1;transform:none}
.card .kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#2b2b2b;font-weight:400;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card .kicker svg{width:14px;height:14px;fill:var(--accent)}
.card h2{font-size:30px;line-height:1.05;margin:0 0 16px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;color:#1a1a1a}
.card p{margin:0;font-size:14px;line-height:1.7;color:var(--ink,#2b2b2b)}
.card.quote{background:rgba(245,245,243,0.97);text-align:center;max-width:620px}
.card.quote h2{font-size:34px;line-height:1.15;margin:8px 0 0}
.card.quote .kicker{justify-content:center}
.card .swatches{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:16px}
.card .stat{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
.card .stat div{border-left:3px solid var(--accent);padding-left:10px}
.card .stat b{display:block;font-size:24px;font-weight:800}
.card .stat small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.sw{display:flex;align-items:center;gap:6px;font-size:12px}
.sw i{width:14px;height:14px;border-radius:3px;display:inline-block}
.hero{width:100%;height:190px;object-fit:cover;border-radius:18px;margin:0 0 18px;box-shadow:0 8px 25px rgba(0,0,0,.5);transform:translateY(10px) scale(.98);opacity:0;transition:transform 1.4s cubic-bezier(.25,.1,.25,1),opacity 1.2s ease}
.step.is-active .hero{transform:none;opacity:1}
.collage{position:relative;height:230px;margin:0 0 18px;perspective:1100px;perspective-origin:50% 50%}
.collage img{position:absolute;top:50%;left:50%;width:46%;height:150px;object-fit:cover;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.6);opacity:0;transition:transform 2s cubic-bezier(.22,.61,.36,1),opacity 1.4s ease;will-change:transform}
.collage img:nth-child(1){transform:translate(-50%,-50%) translate3d(-105%,-28%,-220px) rotateY(32deg)}
.collage img:nth-child(2){transform:translate(-50%,-50%) translate3d(105%,-22%,-220px) rotateY(-32deg);transition-delay:.2s}
.collage img:nth-child(3){transform:translate(-50%,-50%) translate3d(-100%,36%,-220px) rotateY(32deg);transition-delay:.4s}
.collage img:nth-child(4){transform:translate(-50%,-50%) translate3d(100%,30%,-220px) rotateY(-32deg);transition-delay:.6s}
.step.is-active .collage img{opacity:1}
.step.is-active .collage img:nth-child(1){transform:translate(-50%,-50%) translate3d(-52%,-28%,0) rotateY(5deg) rotateZ(-2deg)}
.step.is-active .collage img:nth-child(2){transform:translate(-50%,-50%) translate3d(52%,-22%,20px) rotateY(-5deg) rotateZ(1.5deg)}
.step.is-active .collage img:nth-child(3){transform:translate(-50%,-50%) translate3d(-46%,34%,40px) rotateY(4deg) rotateZ(1.5deg)}
.step.is-active .collage img:nth-child(4){transform:translate(-50%,-50%) translate3d(50%,30%,60px) rotateY(-4deg) rotateZ(-1.5deg)}
.step.is-active .collage.three img:nth-child(1){transform:translate(-50%,-50%) translate3d(-60%,0,0) rotateY(12deg)}
.step.is-active .collage.three img:nth-child(2){transform:translate(-50%,-50%) translate3d(0,0,60px)}
.step.is-active .collage.three img:nth-child(3){transform:translate(-50%,-50%) translate3d(60%,0,0) rotateY(-12deg)}
.step.is-active .collage.two img:nth-child(1){transform:translate(-50%,-50%) translate3d(-52%,0,0) rotateY(10deg)}
.step.is-active .collage.two img:nth-child(2){transform:translate(-50%,-50%) translate3d(52%,0,30px) rotateY(-10deg)}
.story-end{min-height:100vh;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;pointer-events:auto}
.btn-gold{background:var(--accent);color:#fff;border:none;padding:18px 38px;border-radius:30px;font-size:14px;font-weight:bold;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 6px 20px rgba(0,0,0,.45);cursor:pointer;transition:all .3s;font-family:inherit}
.btn-gold:hover{filter:brightness(1.1);transform:translateY(-3px)}
.btn-line{background:rgba(0,0,0,.55);color:#fff;border:1.5px solid rgba(255,255,255,.7);padding:14px 30px;border-radius:30px;font-size:12px;font-weight:bold;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(10px);font-family:inherit;transition:all .3s}
.btn-line:hover{background:rgba(255,255,255,.2)}
/* strategy header bar */
.s-head{position:fixed;top:0;left:0;right:0;z-index:4200;display:flex;align-items:center;gap:12px;padding:12px 18px;background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,0));pointer-events:none}
.s-head .tile{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.5)}
.s-head .tile svg{width:22px;height:22px;fill:#fff}
.s-head b{color:#fff;font-size:12px;letter-spacing:.22em;text-transform:uppercase}
.s-head button{margin-left:auto;pointer-events:auto}

/* ─── Chart panel ────────────────────────────────────────────────────── */
/* POI markers (region chapters) */
.poi{display:flex;align-items:center;gap:8px;pointer-events:none;font-family:var(--font);font-size:11px;letter-spacing:.06em;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9);white-space:nowrap}
.poi i{width:12px;height:12px;border-radius:50%;background:#D4AF37;box-shadow:0 0 0 4px rgba(212,175,55,.35),0 0 18px rgba(212,175,55,.9);flex-shrink:0}
.poi.site i{background:#7ED957;box-shadow:0 0 0 5px rgba(126,217,87,.35),0 0 22px rgba(126,217,87,.95);width:14px;height:14px}
.poi.site span{font-weight:700;font-family:var(--font-head);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
/* CTA inside a card */
.card .cta{margin-top:18px;display:inline-block}
/* House element panel */
#housePanel{position:fixed;right:18px;top:80px;z-index:3000;width:300px;max-height:calc(100vh - 120px);overflow:auto;background:rgba(245,245,243,.97);color:#1f1f1f;border-radius:6px;
  box-shadow:0 14px 50px rgba(0,0,0,.45);padding:18px 18px 16px;display:none;pointer-events:auto;border:1px solid rgba(0,0,0,.06)}
#housePanel.show{display:block}
#housePanel h4{margin:0 0 4px;font-family:var(--font-head);font-size:14px;letter-spacing:.14em;text-transform:uppercase}
#housePanel small{font-size:11px;color:#555}
#housePanel .list{margin-top:12px;display:flex;flex-direction:column;gap:4px}
#housePanel .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:4px;border:1px solid rgba(0,0,0,.08);background:#fff;cursor:pointer;font-size:12px;text-align:left;width:100%}
#housePanel .row:hover{border-color:#D4AF37}
#housePanel .row.on{background:#D4AF37;color:#fff;border-color:#D4AF37}
#housePanel .row b{font-family:var(--font-head);font-size:11px;letter-spacing:.06em}
#housePanel .row small{color:inherit;opacity:.7}
#housePanel .tools{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
#housePanel .tools button{flex:1;padding:9px 10px;border-radius:30px;border:1.5px solid #1f1f1f;background:transparent;font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;font-family:var(--font-head);font-weight:700}
#housePanel .tools button.gold{background:#D4AF37;border-color:#D4AF37;color:#fff}
#housePanel .info{margin-top:10px;font-size:11px;line-height:1.6;color:#333;border-top:1px solid rgba(0,0,0,.08);padding-top:10px;display:none}
#housePanel .info.show{display:block}
@media(max-width:899px){ #housePanel{left:0;right:0;top:auto;bottom:0;width:100%;max-height:46vh;border-radius:6px 6px 0 0} }
#chartPanel{position:fixed;z-index:20;background:rgba(0,0,0,0.86);color:#fff;backdrop-filter:blur(14px);border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,0.7);padding:22px 24px;opacity:0;pointer-events:none;transition:opacity .6s,transform .6s;border:1px solid rgba(255,255,255,.25)}
#chartPanel h3{margin:0 0 4px;font-size:20px}
#chartPanel small{opacity:.75;font-size:12px}
#chartPanel .chart-wrap{position:relative;height:260px;margin-top:12px}
@media(min-width:900px){ #chartPanel{right:4vw;top:50%;transform:translateY(calc(-50% + 20px));width:380px} #chartPanel.show{opacity:1;pointer-events:auto;transform:translateY(-50%)} }
@media(max-width:899px){
  #chartPanel{left:0;right:0;bottom:0;border-radius:24px 24px 0 0;transform:translateY(20px);padding-bottom:max(22px,env(safe-area-inset-bottom))}
  #chartPanel.show{opacity:1;pointer-events:auto;transform:none}
  #chartPanel .chart-wrap{height:180px}
  .step{padding:0 4vw;align-items:flex-start;padding-top:12vh}

fetch(CONFIG.CSV_URL + "&cache=" + Date.now())
  .then(r => { if (!r.ok) throw new Error("CSV fetch failed"); return r.text(); })
  .then(text => {
    const rows = text.trim().split("\n");
    for (let i = 1; i < rows.length; i++){
      const cols = []; let cur = "", inQ = false;
      for (const ch of rows[i] + ","){ if (ch === '"') inQ = !inQ; else if (ch === "," && !inQ){ cols.push(cur.trim()); cur = ""; } else cur += ch; }
      if (cols.length >= 5) externalData[cols[CONFIG.CSV_COL.index]] = { precio:cols[CONFIG.CSV_COL.precio], status:cols[CONFIG.CSV_COL.status] };
    }
    if (chart) showChart(chart.__kind);
  }).catch(err => console.error("Error loading CSV:", err));

const meshData = c => ({...(c.userData||{}), ...(c.userData?.extras||{})});
const seriesOf = idx => { const m = String(idx).match(/^[A-Za-z]+/); return m ? m[0].toUpperCase() : "?"; };
function statusKey(raw){ const n = String(raw).trim().toLowerCase(); if (n === "disponible") return "disponible"; if (n.includes("reserv") || n.includes("apartado")) return "reservado"; return "vendido"; }
const areaColor = a => a >= 1300 ? CONFIG.AREA_COLORS[1300] : a >= 1000 ? CONFIG.AREA_COLORS[1000] : a >= 800 ? CONFIG.AREA_COLORS[800] : a >= 600 ? CONFIG.AREA_COLORS[600] : a >= 400 ? CONFIG.AREA_COLORS[400] : "#888888";
const fmtInt = n => Math.round(n).toLocaleString("es-MX");
const fmtUSD = n => "$ " + Math.round(n).toLocaleString("en-US") + " USD";
const fmtMXN = n => "$ " + Math.round(n).toLocaleString("es-MX") + " MXN";
function getLots(){
  const out = new Map(); if (!terrainModel) return [];
  terrainModel.traverse(c => { if (!c.isMesh) return; const d = meshData(c); if (!d.Index || out.has(d.Index)) return;
    const ext = externalData[d.Index] || {}; const usd = parseFloat(String(ext.precio !== undefined ? ext.precio : (d.Precio || "")).replace(/[^0-9.]/g,"")) || 0;
    out.set(d.Index, { index:d.Index, series:seriesOf(d.Index), area:parseFloat(d.Area)||0, construible:parseFloat(d.Construible)||0, usd, mxn:usd*CONFIG.USD_TO_MXN, status: statusKey(ext.status !== undefined ? ext.status : (d.Status || "")) }); });
  return [...out.values()];
}
function getAmenities(){ const m = new Map(); if (!terrainModel) return []; terrainModel.traverse(c => { const d = meshData(c); if (!c.isMesh || !d.AMENITIES) return; const n = String(d.AMENITIES).trim(); if (!m.has(n)) m.set(n, amenityInfo(n, d)); }); return [...m.values()]; }
function amenityInfo(name, d){ const key = name.toLowerCase(), cfg = CONFIG.AMENITY_INFO[key] || {}; return { name, key, m2: parseFloat(d && d.Area) || cfg.m2 || null, desc:(d && d.Descripcion) || cfg.desc || "", img: CONFIG.REPO_BASE + key.replace(/\s+/g,"_") + "." + (JPG_SET.has(key) ? "jpg" : "png") }; }
function buildClusterColors(){ const s = [...new Set(getLots().map(l => l.series))].sort(); clusterColorMap = {}; s.forEach((k,i) => clusterColorMap[k] = CONFIG.CLUSTER_COLORS[i % CONFIG.CLUSTER_COLORS.length]); }

function getInitialCamera(){ const w = window.innerWidth; return w > 1200 ? CONFIG.CAMERA_DESKTOP_XL : w > 768 ? CONFIG.CAMERA_DESKTOP : CONFIG.CAMERA_MOBILE; }

function computeModelBounds(){
  try{
    tb.world.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(terrainModel); if (box.isEmpty()) return;
    const c = tb.unprojectFromWorld(box.getCenter(new THREE.Vector3()));
    const fb = new mapboxgl.LngLat(CONFIG.MODEL_CENTER_FALLBACK[0], CONFIG.MODEL_CENTER_FALLBACK[1]);
    if (!c || !isFinite(c[0]) || new mapboxgl.LngLat(c[0],c[1]).distanceTo(fb) > 8000) return;
    modelCenter = [c[0], c[1]];
    const corners = [[box.min.x,box.min.y,box.min.z],[box.max.x,box.min.y,box.min.z],[box.min.x,box.max.y,box.min.z],[box.max.x,box.max.y,box.min.z]].map(p => tb.unprojectFromWorld(new THREE.Vector3(...p)));
    modelBounds = corners.reduce((b,p) => b.extend([p[0],p[1]]), new mapboxgl.LngLatBounds([c[0],c[1]],[c[0],c[1]]));
  }catch(e){ console.warn("model bounds fallback", e); }
}

function clearOtherModes(except){

  if (except !== "amenities") { amenitiesMode = false; $("amenitiesButton").classList.remove("active"); }

function resetAllMaterials(){ if (terrainModel) terrainModel.traverse(c => { if (c.isMesh && originalMaterials.has(c)) c.material = originalMaterials.get(c).clone(); }); if (modelOpacity < 1) setModelOpacity(modelOpacity); }
function toggleAmenityTriangles(enable){ if (triangulosGroup) triangulosGroup.visible = enable; }
function paint(c, color){ c.material = c.material.clone(); c.material.color = new THREE.Color(color); }
function applyAmenitiesColors(enable){

}

/* ══════════════════════════════════════════════════════════════════════
   ANIMATIONS
   ══════════════════════════════════════════════════════════════════════ */
const ease = t => t < .5 ? 2*t*t : -1 + (4-2*t)*t;
function tween(ms, step, done){ const t0 = performance.now(); (function f(now){ const k = Math.min(1,(now-t0)/ms); step(ease(k)); map.triggerRepaint(); if (k < 1) requestAnimationFrame(f); else if (done) done(); })(t0); }
function setOpacityOn(root, o){ if (!root) return; root.traverse(c => { if (!c.isMesh) return; (Array.isArray(c.material) ? c.material : [c.material]).forEach(m => { if (o >= 1){ m.transparent = false; m.opacity = 1; } else { m.transparent = true; m.opacity = o; } m.needsUpdate = true; }); }); }
function setModelOpacity(o){ modelOpacity = o; setOpacityOn(terrainModel, o); map.triggerRepaint(); }
function fadeModel(to, ms){ const from = modelOpacity; if (Math.abs(from-to) < .01) return; tween(ms, k => setModelOpacity(from + (to-from)*k)); }
function setTreesOpacity(o){ treesOpacity = o; setOpacityOn(treesGroup, o); }
function fadeTrees(to, ms){ const from = treesOpacity; if (Math.abs(from-to) < .01) return; tween(ms, k => setTreesOpacity(from + (to-from)*k)); }
function pulseLots(){ if (!terrainModel) return; const hl = new THREE.Color(CONFIG.LOT_HIGHLIGHT);
  tween(2200, k => { const s = Math.sin(k*Math.PI)*0.6; terrainModel.traverse(c => { if (c.isMesh && meshData(c).Index && c.material.emissive) c.material.emissive.copy(hl).multiplyScalar(s); }); },
    () => terrainModel.traverse(c => { if (c.isMesh && meshData(c).Index && c.material.emissive) c.material.emissive.setHex(0x000000); })); }
function popTriangles(){ if (!triangulosGroup) return; tween(1400, k => triangulosGroup.traverse(c => { if (c.isMesh) c.scale.setScalar(Math.max(0.001, k)); })); }
function slowOrbit(on){ orbiting = on; if (!on){ map.stop(); return; } map.once("moveend", () => { if (orbiting) map.rotateTo(map.getBearing() + 150, { duration:70000, easing:t=>t }); }); }

/* Smooth camera easing (ease-in-out cubic) */
const CAM_EASE = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;

/* ─── Lots rising from the ground, cluster by cluster (A, then B, then C …) ───
   Each lot mesh gets its geometry re-anchored to its own base so that scaling
   along the world-up axis makes the volume "grow" out of the terrain. */
const lotGrow = { prepared:false, meshes:[], raf:null };
function prepareLotGrow(){
  if (lotGrow.prepared || !terrainModel) return;
  terrainModel.updateMatrixWorld(true);
  const worldUp = new THREE.Vector3(0,0,1);
  terrainModel.traverse(c => {
    if (!c.isMesh || !meshData(c).Index || !c.geometry) return;
    const inv = new THREE.Matrix4().copy(c.matrixWorld).invert();
    const up = worldUp.clone().transformDirection(inv);
    const abs = [Math.abs(up.x), Math.abs(up.y), Math.abs(up.z)];
    const axis = ["x","y","z"][abs.indexOf(Math.max(...abs))], sign = Math.sign(up[axis]) || 1;
    c.geometry = c.geometry.clone(); c.geometry.computeBoundingBox();
    const bb = c.geometry.boundingBox, off = bb.getCenter(new THREE.Vector3()); off[axis] = sign > 0 ? bb.min[axis] : bb.max[axis];
    c.geometry.translate(-off.x, -off.y, -off.z);
    c.position.add(off.clone().multiply(c.scale).applyQuaternion(c.quaternion));
    c.userData.__grow = { axis, base:c.scale[axis], series:seriesOf(meshData(c).Index), num:parseInt(String(meshData(c).Index).replace(/\D/g,""),10) || 0 };
    lotGrow.meshes.push(c);
  });
  lotGrow.prepared = true;
}
function growLots(opts){
  if (!terrainModel) return; prepareLotGrow(); if (!lotGrow.meshes.length) return;
  if (lotGrow.raf) cancelAnimationFrame(lotGrow.raf);
  const only = opts && opts.lots ? opts.lots.map(x => x.toUpperCase()) : null;
  if (only) lotGrow.meshes.forEach(m => { const g = m.userData.__grow; m.scale[g.axis] = g.base * 0.001; });   /* subset: everything else stays collapsed */
  const pool = only ? lotGrow.meshes.filter(m => only.includes(String(meshData(m).Index).toUpperCase())) : lotGrow.meshes;
  if (!pool.length) return;
  const G = CONFIG.GROW_LOTS, series = [...new Set(pool.map(m => m.userData.__grow.series))].sort();
  const groupDur = G.total * G.groupShare, stagger = series.length > 1 ? (G.total - groupDur) / (series.length - 1) : 0;
  const maxNum = {}; pool.forEach(m => { const g = m.userData.__grow; maxNum[g.series] = Math.max(maxNum[g.series] || 1, g.num); });
  pool.forEach(m => { const g = m.userData.__grow; m.scale[g.axis] = g.base * 0.001;
    g.start = series.indexOf(g.series) * stagger + (g.num / maxNum[g.series]) * groupDur * 0.35; g.dur = groupDur * 0.65; });
  const t0 = performance.now(), easeOut = t => 1 - Math.pow(1 - t, 3);
  const step = now => { const t = now - t0; let done = true;
    pool.forEach(m => { const g = m.userData.__grow; const k = Math.min(1, Math.max(0, (t - g.start) / g.dur)); if (k < 1) done = false; m.scale[g.axis] = g.base * Math.max(0.001, easeOut(k)); });
    map.triggerRepaint(); lotGrow.raf = done ? null : requestAnimationFrame(step); };
  lotGrow.raf = requestAnimationFrame(step);
}
function collapseLots(){ prepareLotGrow(); if (lotGrow.raf){ cancelAnimationFrame(lotGrow.raf); lotGrow.raf = null; } lotGrow.meshes.forEach(m => { const g = m.userData.__grow; m.scale[g.axis] = g.base * 0.001; }); if (map) map.triggerRepaint(); }
function lotsOnly(list){ prepareLotGrow(); if (lotGrow.raf){ cancelAnimationFrame(lotGrow.raf); lotGrow.raf = null; } const L = list.map(x => x.toUpperCase()); lotGrow.meshes.forEach(m => { const g = m.userData.__grow; m.scale[g.axis] = g.base * (L.includes(String(meshData(m).Index).toUpperCase()) ? 1 : 0.001); }); if (map) map.triggerRepaint(); }
function finishGrowLots(){ if (lotGrow.raf){ cancelAnimationFrame(lotGrow.raf); lotGrow.raf = null; } lotGrow.meshes.forEach(m => { const g = m.userData.__grow; m.scale[g.axis] = g.base; }); if (map) map.triggerRepaint(); }

/* ─── Mesh selectors ─── sel = key of CONFIG.MESH | {nameRegex, excludeRegex, amenities, lots, series, excludeAmenities} */
function resolveSel(sel){ return typeof sel === "string" ? (CONFIG.MESH[sel] || { nameRegex:sel }) : (sel || {}); }
function matchMesh(c, sel){
  const d = meshData(c), name = String(c.name || "");
  if (sel.excludeAmenities && d.AMENITIES) return false;
  if (sel.excludeRegex && new RegExp(sel.excludeRegex, "i").test(name)) return false;
  const am = (sel.amenities || []).map(x => x.toLowerCase());
  if (am.length && d.AMENITIES && am.includes(String(d.AMENITIES).trim().toLowerCase())) return true;
  if (sel.lots && d.Index && sel.lots.map(x => x.toUpperCase()).includes(String(d.Index).toUpperCase())) return true;
  if (sel.series && d.Index && sel.series.includes(seriesOf(d.Index))) return true;
  if (sel.nameRegex){ const rx = new RegExp(sel.nameRegex, "i"); if (rx.test(name) || rx.test(String(d.AMENITIES || "")) || rx.test(String(d.Name || d.name || ""))) return true; }
  return false;
}
function meshesFor(sel){ const S = resolveSel(sel), out = []; if (terrainModel) terrainModel.traverse(c => { if (c.isMesh && matchMesh(c, S)) out.push(c); }); return out; }
function lngLatOf(spec){                       /* "lot:A1" | "amenity:casa cenotes" | "mesh:regex" → [lng,lat] */
  if (lngLatCache[spec]) return lngLatCache[spec];
  const [type, val] = spec.split(":"); const sel = type === "lot" ? { lots:[val] } : type === "amenity" ? { amenities:[val] } : { nameRegex:val };
  const ms = meshesFor(sel); if (!ms.length) return null;
  tb.world.updateMatrixWorld(true); const box = new THREE.Box3(); ms.forEach(m => box.expandByObject(m));
  const ll = tb.unprojectFromWorld(box.getCenter(new THREE.Vector3())); return lngLatCache[spec] = [ll[0], ll[1]];
}

/* ─── Show / hide / reveal / glow ─── */
function cancelAnims(list){ list.forEach(id => cancelAnimationFrame(id)); list.length = 0; }
function setVisibleSel(sel, vis){ meshesFor(sel).forEach(c => c.visible = vis); }
function showAllSel(){ Object.keys(CONFIG.MESH).forEach(k => setVisibleSel(k, true)); }
function revealSel(sel, opts = {}){
  const ms = meshesFor(sel); if (!ms.length){ console.warn("reveal: no meshes for", sel); return; }
  ms.sort((a,b) => String(a.name).localeCompare(String(b.name), undefined, {numeric:true}));
  const total = opts.total || 3000, each = Math.min(total, Math.max(900, total * 0.45)), stagger = ms.length > 1 ? (total - each) / (ms.length - 1) : 0;
  ms.forEach((c,i) => { c.visible = true; c.material = c.material.clone(); c.material.transparent = true; c.material.opacity = 0; if (opts.color) c.material.color = new THREE.Color(opts.color); c.userData.__rv = { start:i*stagger, dur:each }; });
  const t0 = performance.now(), easeOut = t => 1 - Math.pow(1 - t, 3);
  const step = now => { const t = now - t0; let done = true;
    ms.forEach(c => { const r = c.userData.__rv; const k = Math.min(1, Math.max(0, (t - r.start) / r.dur)); if (k < 1) done = false; c.material.opacity = easeOut(k); if (k >= 1) c.material.transparent = false; });
    map.triggerRepaint(); if (!done) revealAnims.push(requestAnimationFrame(step)); };
  revealAnims.push(requestAnimationFrame(step));
}
function glowSel(sel, opts = {}){
  const ms = meshesFor(sel); if (!ms.length){ console.warn("glow: no meshes for", sel); return; }
  tb.world.updateMatrixWorld(true);
  ms.sort((a,b) => new THREE.Box3().setFromObject(a).min.x - new THREE.Box3().setFromObject(b).min.x);   /* light up one after another */
  const col = new THREE.Color(opts.color || "#F2C048"), total = opts.total || 4000, each = Math.max(700, total * 0.4), stagger = ms.length > 1 ? (total - each) / (ms.length - 1) : 0;
  ms.forEach((c,i) => { c.material = c.material.clone(); if (!c.material.emissive) return; c.material.emissive = col.clone(); c.material.emissiveIntensity = 0; c.userData.__gl = { start:i*stagger, dur:each, base:c.material.color.clone() }; });
  const t0 = performance.now(), easeOut = t => 1 - Math.pow(1 - t, 3);
  const step = now => { const t = now - t0; let done = true;
    ms.forEach(c => { const g = c.userData.__gl; if (!g) return; const k = Math.min(1, Math.max(0, (t - g.start) / g.dur)); if (k < 1) done = false;
      c.material.emissiveIntensity = 1.6 * easeOut(k); c.material.color.copy(g.base).lerp(col, 0.6 * easeOut(k)); });
    map.triggerRepaint(); if (!done) glowAnims.push(requestAnimationFrame(step)); };
  glowAnims.push(requestAnimationFrame(step));
}

/* ─── POIs + links (regional chapters) ─── */
function buildPois(){

  CONFIG.POIS.forEach(p => { const el = document.createElement("div"); el.className = "poi " + (p.kind || ""); el.innerHTML = `<i></i><span>${p.name}</span>`; poiMarkers.push(new mapboxgl.Marker({ element:el, anchor:"left" }).setLngLat(p.lnglat)); });
  const el = document.createElement("div"); el.className = "poi site"; el.innerHTML = `<i></i><span>${CONFIG.PROJECT}</span>`; poiMarkers.push(new mapboxgl.Marker({ element:el, anchor:"left" }).setLngLat(modelCenter));
}
function showPois(on){ buildPois(); poiMarkers.forEach(m => on ? m.addTo(map) : m.remove()); }
function ensureLinksLayer(){
  if (linksLayerReady || !map.isStyleLoaded()) return;
  map.addSource("poi-links", { type:"geojson", data:{ type:"FeatureCollection", features:CONFIG.POIS.map(p => ({ type:"Feature", geometry:{ type:"LineString", coordinates:[p.lnglat, modelCenter] } })) } });
  map.addLayer({ id:"poi-links", type:"line", source:"poi-links", paint:{ "line-color":"#D4AF37", "line-width":2, "line-opacity":0, "line-dasharray":[2,2] } });

/* ─── The AMA house (HOUSE_V1.glb) ─── */
function ensureHouse(){
  if (houseModel) return Promise.resolve(houseModel);
  if (houseLoading) return houseLoading;
  const H = CONFIG.HOUSE, ll = lngLatOf("lot:" + H.lot) || modelCenter;
  houseLoading = new Promise(resolve => {
    try{
      tb.loadObj({ obj:H.url, type:"gltf", scale:H.scale, units:"meters", rotation:H.loadRotation }, obj => {
        if (!obj){ console.warn("HOUSE_V1.glb not available yet"); resolve(null); return; }
        obj.setCoords([ll[0], ll[1], H.offset.z || 0]); obj.setRotation(H.setRotation); obj.translateX(H.offset.x || 0); obj.translateY(H.offset.y || 0);
        obj.traverse(c => { if (c.isMesh && c.material){ c.castShadow = c.receiveShadow = true; c.material = c.material.clone(); houseMaterials.set(c, c.material.clone()); } });
        houseModel = obj; tb.add(obj); map.triggerRepaint(); resolve(obj);
      });
    }catch(e){ console.warn("house load failed", e); resolve(null); }
    setTimeout(() => resolve(houseModel), 12000);          /* 404 or slow network: give up gracefully */
  });
  setTimeout(() => { if (!houseModel){ console.warn("HOUSE_V1.glb did not load (add it to the GitHub repo)"); } }, 15000);
  return houseLoading;
}
function showHouse(on){ if (on) ensureHouse().then(o => { if (o) o.visible = true; map.triggerRepaint(); }); else if (houseModel){ houseModel.visible = false; map.triggerRepaint(); } }
function houseGroups(){
  if (!houseModel) return [];
  const root = houseModel.model || houseModel.children[0] || houseModel, groups = new Map();
  houseModel.traverse(c => { if (!c.isMesh) return;
    let g = (c.parent && c.parent !== root && c.parent !== houseModel && c.parent.name) ? c.parent.name : (String(c.name || "Element").split(/[_\-\s.]/)[0] || "Elements");
    if (!groups.has(g)) groups.set(g, []); groups.get(g).push(c); });
  return [...groups.entries()].map(([name, meshes]) => ({ name, meshes })).sort((a,b) => a.name.localeCompare(b.name));
}
function houseIsolate(meshes){
  if (!houseModel) return;
  houseModel.traverse(c => { if (!c.isMesh) return; const base = houseMaterials.get(c); if (!base) return; c.material = base.clone();
    if (meshes && !meshes.includes(c)){ c.material.transparent = true; c.material.opacity = 0.12; } });
  if (meshes && meshes.length === 1 && meshes[0].material.emissive){ meshes[0].material.emissive = new THREE.Color("#D4AF37"); meshes[0].material.emissiveIntensity = 0.5; }
  map.triggerRepaint();
}
function renderHousePanel(){
  const P = $("housePanel"), groups = houseGroups();
  if (!houseModel){ P.innerHTML = `<h4>${CONFIG.HOUSE.name}</h4><small>HOUSE_V1.glb is not in the repository yet. Upload it to <code>${CONFIG.HOUSE.url.replace(/^https?:\/\//,"")}</code> and reload.</small>`; return; }
  const g = houseSelection.group;
  P.innerHTML = `<h4>${CONFIG.HOUSE.name}</h4><small>${groups.length} groups · ${groups.reduce((a,x) => a + x.meshes.length, 0)} elements</small>
    <div class="list">${!g ? groups.map((x,i) => `<button class="row" data-g="${i}"><b>${x.name.toUpperCase()}</b><small>${x.meshes.length} el.</small></button>`).join("")
      : `<button class="row on" data-back="1"><b>← ${g.name.toUpperCase()}</b><small>${g.meshes.length} el.</small></button>` + g.meshes.map((m,i) => `<button class="row ${houseSelection.mesh === m ? "on" : ""}" data-m="${i}"><b>${m.name || "element " + (i+1)}</b></button>`).join("")}</div>
    <div class="info ${houseSelection.mesh ? "show" : ""}" id="houseInfo">${houseSelection.mesh ? houseInfoHTML(houseSelection.mesh) : ""}</div>
    <div class="tools"><button data-all="1">Show all</button><button class="gold" data-report="1">House report</button></div>`;
  P.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { houseSelection = { group:groups[+b.dataset.g], mesh:null }; houseIsolate(houseSelection.group.meshes); renderHousePanel(); });
  P.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { houseSelection.mesh = houseSelection.group.meshes[+b.dataset.m]; houseIsolate([houseSelection.mesh]); renderHousePanel(); });
  P.querySelectorAll("[data-back]").forEach(b => b.onclick = () => { houseSelection = { group:null, mesh:null }; houseIsolate(null); renderHousePanel(); });
  P.querySelectorAll("[data-all]").forEach(b => b.onclick = () => { houseSelection = { group:null, mesh:null }; houseIsolate(null); renderHousePanel(); });
  P.querySelectorAll("[data-report]").forEach(b => b.onclick = openHouseReport);
}
function houseInfoHTML(m){ const d = meshData(m), keys = Object.keys(d).filter(k => !k.startsWith("__") && k !== "extras" && typeof d[k] !== "object");
  return `<b>${m.name || "element"}</b><br>${keys.length ? keys.map(k => `${k}: ${d[k]}`).join("<br>") : "No metadata in this element."}`; }
function showHousePanel(on){ const P = $("housePanel");
  if (on){ P.innerHTML = `<h4>${CONFIG.HOUSE.name}</h4><small>Loading house model…</small>`; P.classList.add("show");

/* Declarative chapter actions */
function applyActions(a = {}){
  cancelAnims(revealAnims); cancelAnims(glowAnims);
  resetAllMaterials(); clearOtherModes(null); hideChart();
  /* visibility of named mesh groups: hidden, revealed (animated) or simply shown */
  Object.keys(CONFIG.MESH).forEach(k => { if ((a.hide || []).includes(k)) setVisibleSel(k, false); else if (!(a.reveal && a.reveal.sel === k)) setVisibleSel(k, true); });
  if (a.mode) applyMode(a.mode);
  if (a.highlight){ const h = a.highlight.sel ? { ...resolveSel(a.highlight.sel), ...a.highlight } : a.highlight; highlightMeshes(h); }
  if (a.reveal) revealSel(a.reveal.sel, a.reveal);
  if (a.glow) glowSel(a.glow.sel, a.glow);
  if (a.pulseLots) pulseLots();
  if (a.lotsHidden) collapseLots(); else if (a.lotsOnly) lotsOnly(a.lotsOnly); else if (a.growLots) growLots(a.growLots === true ? undefined : a.growLots); else finishGrowLots();
  showPois(!!a.pois); showLinks(!!a.links);
  showHouse(!!a.house); showHousePanel(!!a.housePanel);
  if (a.trees !== undefined && treesGroup){ treesGroup.visible = a.trees; if (a.trees) fadeTrees(1, 2000); }
  if (a.treesColor !== undefined) applyTreesStyle(!a.treesColor);
  if (a.triangles){ toggleAmenityTriangles(true); popTriangles(); }
  if (a.chart) showChart(a.chart);
  if (a.orbit) slowOrbit(true);
}
function revertActions(a = {}){
  if (a.orbit) slowOrbit(false); if (a.chart) hideChart(); if (a.growLots) finishGrowLots();
  cancelAnims(revealAnims); cancelAnims(glowAnims);
  if (a.triangles || a.mode === "amenities") toggleAmenityTriangles(false);
  if (a.treesColor) applyTreesStyle(true);
}

/* ══════════════════════════════════════════════════════════════════════
   STORY ENGINE — one Scrollama instance per story
   ══════════════════════════════════════════════════════════════════════ */
class Story {
  constructor({ mount, chapters, accent, icon, title, endHTML, onEnd }){
    Object.assign(this, { mount, chapters, accent:accent||"#D4AF37", icon, title, endHTML, onEnd });
    this.current = -1; this.pending = -1; this.scroller = null; this.io = null;
  }
  build(){
    const sw = kind => kind === "area" ? CONFIG.AREA_CATS.map(c => `<span class="sw"><i style="background:${c.color}"></i>${c.label}</span>`).join("")
      : Object.entries(CONFIG.STATUS_COLORS).map(([k,v]) => `<span class="sw"><i style="background:${v}"></i>${k.toUpperCase()}</span>`).join("");
    const media = c => !c.media ? "" : c.media.hero ? `<img class="hero" src="${c.media.hero}" alt="">`
      : `<div class="collage ${c.media.collage.length === 3 ? "three" : c.media.collage.length === 2 ? "two" : ""}">${c.media.collage.map(u => `<img src="${u}" alt="">`).join("")}</div>`;
    const stats = c => c.stats ? `<div class="stat">${c.stats.map(s => `<div><b>${s.v}</b><small>${s.l}</small></div>`).join("")}</div>` : "";
    const head = this.title ? `<div class="s-head" style="--accent:${this.accent}"><span class="tile">${ICONS[this.icon]||""}</span><b>${this.title}</b><button class="btn-line" data-close>Volver al modelo</button></div>` : "";
    this.mount.style.setProperty("--accent", this.accent);
    this.mount.innerHTML = head + this.chapters.map((c,i) => `<div class="step ${c.center ? "center" : (c.side || "")}" data-step="${i}"><div class="card ${c.wide ? "wide" : ""} ${c.quote ? "quote" : ""}" ${c.ink ? `style="--ink:${c.ink}"` : ""}>
      ${c.k ? `<div class="kicker">${this.icon ? ICONS[this.icon] : ""}${c.k}</div>` : ""}${media(c)}${c.h ? `<h2>${c.h}</h2>` : ""}${c.p ? `<p>${c.p}</p>` : ""}${stats(c)}${c.swatches ? `<div class="swatches">${sw(c.swatches)}</div>` : ""}${c.cta ? `<button class="btn-gold cta" data-run="${c.cta.run}">${c.cta.label}</button>` : ""}</div></div>`).join("")
      + `<div class="story-end">${this.endHTML}</div>`;
    this.mount.querySelectorAll("[data-close]").forEach(b => b.onclick = () => this.onEnd && this.onEnd("close"));
    this.mount.querySelectorAll("[data-next]").forEach(b => b.onclick = () => this.onEnd && this.onEnd(b.dataset.next));
    this.mount.querySelectorAll("[data-run]").forEach(b => b.onclick = () => runStoryAction(b.dataset.run, this));
  }
  start(at = 0){
    activeStory = this; this.build(); this.mount.classList.add("on");
    document.body.classList.add("narrative"); document.body.classList.remove("interactive");
    document.documentElement.style.setProperty("--accent", this.accent);
    HANDLERS.forEach(h => map[h] && map[h].disable());
    const steps = this.mount.querySelectorAll(".step");
    window.scrollTo(0, at > 0 && steps[at] ? steps[at].offsetTop : 0);
    this.initScroll(); this.go(at);
  }
  initScroll(){
    const sel = `#${this.mount.id} .step`;
    try{
      if (typeof scrollama !== "function") throw new Error("no scrollama");
      this.scroller = scrollama(); this.scroller.setup({ step:sel, offset:0.5 }).onStepEnter(r => this.activate(r.element)).onStepExit(r => r.element.classList.remove("is-active"));
      this.onResize = () => this.scroller.resize(); window.addEventListener("resize", this.onResize);
    }catch(e){ this.io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) this.activate(en.target); }), { rootMargin:"-50% 0px -50% 0px" }); this.mount.querySelectorAll(".step").forEach(s => this.io.observe(s)); }
    this.onScroll = () => { const h = document.documentElement; $("progress").style.width = (h.scrollTop/(h.scrollHeight-h.clientHeight)*100) + "%"; };
    window.addEventListener("scroll", this.onScroll, {passive:true});
  }
  activate(el){ this.mount.querySelectorAll(".step").forEach(s => s.classList.remove("is-active")); el.classList.add("is-active"); this.go(+el.dataset.step); }
  go(i){
    if (!modelsReady){ this.pending = i; this.current = i; return; }
    if (this.current >= 0 && this.current !== i) revertActions(this.chapters[this.current].actions);
    this.current = i; const ch = this.chapters[i];
    if (i > 0 && modelOpacity < 1) fadeModel(1, 1500);
    const base = getInitialCamera(), useOwn = !CONFIG.CAMERA.uniform || ch.cam.custom;
    let cam = { center:base.center, zoom:base.zoom, pitch:base.pitch, bearing:base.bearing };
    if (useOwn){ const { custom, centerOn, duration, ...own } = ch.cam; cam = { ...cam, ...own }; cam.center = own.center || (centerOn && lngLatOf(centerOn)) || modelCenter; }
    map.stop(); map.flyTo({ ...cam, duration:(ch.cam.duration||4000)*CONFIG.CAMERA.durationScale, essential:true, curve:CONFIG.CAMERA.curve, easing:CAM_EASE });
    applyActions(ch.actions);
  }
  resume(){ this.go(Math.max(this.pending, this.current, 0)); }
  stop(){
    if (this.current >= 0) revertActions(this.chapters[this.current].actions);
    if (this.scroller) this.scroller.destroy(); if (this.io) this.io.disconnect();
    window.removeEventListener("resize", this.onResize || (()=>{})); window.removeEventListener("scroll", this.onScroll || (()=>{}));
    this.mount.classList.remove("on"); this.mount.innerHTML = ""; this.current = -1; if (activeStory === this) activeStory = null;
    showPois(false); showLinks(false); showHousePanel(false);
  }
}
/* Buttons inside cards (cta.run) */
function runStoryAction(run, from){
  if (run === "house"){
    const back = from === mainStory ? mainStory.current : 0;
    from.stop();
    houseStory = new Story({ mount:$("houseStory"), chapters:CONFIG.HOUSE_STORY.chapters, accent:CONFIG.HOUSE_STORY.accent, title:CONFIG.HOUSE_STORY.title,
      endHTML:`<button class="btn-gold" data-close>Back to the story</button><button class="btn-line" data-report-house>Printable house report</button>`,
      onEnd: () => { houseStory.stop(); mainStory.start(back); } });
    houseStory.start();
    $("houseStory").querySelectorAll("[data-report-house]").forEach(b => b.onclick = openHouseReport);

map.on("click", e => {
  if (!document.body.classList.contains("interactive")) return;
  const hits = tb.queryRenderedFeatures(e.point);
  if (selectionLight){ tb.remove(selectionLight); selectionLight = null; }
  if (selectedObject && originalMaterial){ selectedObject.material = originalMaterial; selectedObject = null; }
  infoBox.classList.remove("visible");
  ["reserveBtn","reserveForm","thankYouMsg","fichaBtn","metaDesc"].forEach(id => $(id).style.display = "none");
  amenityImg.style.display = "none"; fullscreenOverlay.classList.remove("visible");
  if (statusMode) applyStatusColors(false); if (areaMode) applyAreaColors(false); if (amenitiesMode) applyAmenitiesColors(false); if (clusterMode) applyClusterColors(false);
  if (!hits.length) return;
  const obj = hits[0].object, d = meshData(obj); if (!d.AMENITIES && !d.Index) return;
  selectedObject = obj; originalMaterial = obj.material.clone(); let lightColor, colorEstado = CONFIG.AMENITIES_COLOR;
  if (d.AMENITIES){
    const a = amenityInfo(String(d.AMENITIES).trim(), d);
    $("metaLote").innerHTML = `<div class="value amenity-value">${a.name.toUpperCase()}</div>`;
    $("metaArea").innerHTML = a.m2 ? `<div class="label">SUPERFICIE</div><div class="value">${fmtInt(a.m2)} m²</div>` : "";

    amenityImg.src = a.img; amenityImg.style.display = "block"; lightColor = new THREE.Color(CONFIG.AMENITIES_COLOR);
  } else {

    const precioRaw = ext.precio !== undefined ? ext.precio : (d.Precio || "—");
    let usd = parseFloat(precioRaw.toString().replace(/[^0-9.]/g,"").trim()); if (isNaN(usd)) usd = 0;
    const usdF = usd > 0 ? usd.toLocaleString("en-US") : "—", mxnF = usd > 0 ? (usd*CONFIG.USD_TO_MXN).toLocaleString("es-MX",{maximumFractionDigits:0}) : "—";
    const priceHTML = cur => `<div class="label">PRECIO</div><div class="value">$ ${cur==="usd"?usdF:mxnF} <span style="font-size:18px;opacity:0.8;">${cur.toUpperCase()}</span></div>`;
    const mp = $("metaPrecio"); mp.innerHTML = priceHTML("usd"); mp.dataset.mode = "usd"; mp.onclick = function(){ this.dataset.mode = this.dataset.mode === "usd" ? "mxn" : "usd"; this.innerHTML = priceHTML(this.dataset.mode); };
    const key = statusKey(ext.status !== undefined ? ext.status : (d.Status || "")); colorEstado = CONFIG.STATUS_COLORS[key];
    $("metaLote").innerHTML = `<div class="label">LOTE</div><div class="value">${currentLot}</div>`;
    $("metaArea").innerHTML = `<div class="label">ÁREA</div><div class="value">${d.Area||"—"}</div>`;
    $("metaConst").innerHTML = `<div class="label">CONSTRUIBLE</div><div class="value">${d.Construible||"—"}</div>`;
    $("metaEstado").innerHTML = `<div class="value" style="color:${colorEstado};font-size:26px;">${key.toUpperCase()}</div>`;
    if (key === "disponible") $("reserveBtn").style.display = "block";
    const ficha = $("fichaBtn"); ficha.href = CONFIG.PDF_BASE + currentLot + CONFIG.PDF_EXT; ficha.style.display = "block";
    lightColor = new THREE.Color(colorEstado);
  }
  selectionLight = new THREE.PointLight(lightColor, darkMode ? 40 : 25, 80, 2);
  const pos = obj.getWorldPosition(new THREE.Vector3()); pos.y += 20; selectionLight.position.copy(pos);
  selectionLight.castShadow = true; selectionLight.shadow.mapSize.width = selectionLight.shadow.mapSize.height = 1024; selectionLight.shadow.camera.near = 0.5; selectionLight.shadow.camera.far = 500; tb.add(selectionLight);
  obj.material = obj.material.clone(); obj.material.color = new THREE.Color(colorEstado); obj.material.emissive = new THREE.Color(0x000000); obj.material.emissiveIntensity = 0;
  const isMobile = window.innerWidth <= 767, w = map.getContainer().clientWidth, h = map.getContainer().clientHeight;
  map.flyTo({ center:e.lngLat, offset:[(isMobile ? 0.5 : 0.65)*w - w/2, (isMobile ? 0.35 : 0.5)*h - h/2], zoom:Math.min(map.getZoom()+2, 18.5), duration:1800, essential:true });
  infoBox.classList.add("visible");
  setTimeout(() => { if (window.innerWidth <= 767){ logosSection.classList.remove("visible"); checkLogosVisibility(); } }, 600);

const sleep = ms => new Promise(r => setTimeout(r, ms));
function waitIdle(maxMs){ return Promise.race([ new Promise(r => map.once("idle", r)), sleep(maxMs) ]); }
async function snapshot(mode){
  showAllSel(); applyMode(mode); if (mode !== "amenities") toggleAmenityTriangles(false);
  const S = CONFIG.REPORT_SNAPSHOT;
  /* exact fit to the model, then zoom out so the margin equals marginRatio × model size per side */
  const cam = modelBounds ? map.cameraForBounds(modelBounds, { padding:0, bearing:S.bearing, pitch:0 }) : { center:modelCenter, zoom:14.6 };
  const zoom = cam.zoom - Math.log2(1 + 2*S.marginRatio);
  map.jumpTo({ center:cam.center, zoom, pitch:0, bearing:S.bearing }); map.triggerRepaint(); await waitIdle(2500); map.triggerRepaint(); await sleep(120);
  return map.getCanvas().toDataURL("image/jpeg", 0.88);
}
async function openReport(){
  finishGrowLots(); $("busyModal").classList.add("show");
  const saved = { center:map.getCenter(), zoom:map.getZoom(), pitch:map.getPitch(), bearing:map.getBearing(), mode: statusMode?"status":areaMode?"area":amenitiesMode?"amenities":clusterMode?"cluster":null, trees: treesGroup ? treesGroup.visible : true };
  if (selectionLight){ tb.remove(selectionLight); selectionLight = null; } if (selectedObject && originalMaterial){ selectedObject.material = originalMaterial; selectedObject = null; }
  infoBox.classList.remove("visible"); if (treesGroup) treesGroup.visible = false;
  const shots = {}; for (const m of ["none","status","area","cluster","amenities"]){ $("busyText").textContent = `Capturando vista: ${m === "none" ? "general" : m}…`; shots[m] = await snapshot(m); }
  applyMode(saved.mode); if (!saved.mode) hideLegend(); if (treesGroup) treesGroup.visible = saved.trees; map.jumpTo(saved); $("busyModal").classList.remove("show");
  renderReport(shots);
}
function renderReport(shots){
  const lots = getLots(), total = lots.length, st = statusStats(lots), ar = areaStats(lots), amen = getAmenities();
  const sum = (arr, f) => arr.reduce((a,l) => a + f(l), 0);
  const m2 = sum(lots, l=>l.area), m2c = sum(lots, l=>l.construible), usd = sum(lots, l=>l.usd);
  const avail = lots.filter(l => l.status === "disponible"), placed = lots.filter(l => l.status !== "disponible");
  const usdAvail = sum(avail, l=>l.usd), usdPlaced = sum(placed, l=>l.usd);
  const pct = (n, of = total) => of ? (n/of*100).toFixed(1) + "%" : "0%";
  const avgArea = total ? m2/total : 0, avgPrice = total ? usd/total : 0, ppm2 = m2 ? usd/m2 : 0;
  const rng = a => a.length ? [Math.min(...a), Math.max(...a)] : [0,0]; const [minA,maxA] = rng(lots.map(l=>l.area)), [minP,maxP] = rng(lots.filter(l=>l.usd>0).map(l=>l.usd));
  const series = {}; lots.forEach(l => { const s = series[l.series] = series[l.series] || {n:0,disp:0,res:0,ven:0,usd:0,m2:0,m2c:0,usdDisp:0}; s.n++; s.usd += l.usd; s.m2 += l.area; s.m2c += l.construible; if (l.status==="disponible"){ s.disp++; s.usdDisp += l.usd; } else if (l.status==="reservado") s.res++; else s.ven++; });
  const now = new Date().toLocaleString("es-MX",{dateStyle:"long", timeStyle:"short"});
  const rowsAll = lots.slice().sort((a,b) => String(a.index).localeCompare(String(b.index), undefined, {numeric:true}));
  const shot = (k, cap) => `<img class="shot" src="${shots[k]}" alt="${cap}"><div class="shot-cap">${cap}</div>`;
  $("reportBody").innerHTML = `
    <div class="rp-head"><div><img src="${CONFIG.LOGO}" alt=""><h1>Reporte general del proyecto</h1><div class="meta">Generado ${now} · Fuente: modelo 3D + Google Sheet · Tipo de cambio ${CONFIG.USD_TO_MXN} MXN/USD</div></div>
      <div class="rp-tools"><button class="print" onclick="window.print()">IMPRIMIR / PDF</button><button class="close" id="reportClose">CERRAR</button></div></div>
    <h2 class="sec">Resumen ejecutivo</h2>
    <div class="kpis">
      <div class="kpi"><label>Total de lotes</label><b>${fmtInt(total)}</b><small>${Object.keys(series).length} clusters · ${amen.length} amenidades</small></div>
      <div class="kpi"><label>Superficie total lotes</label><b>${fmtInt(m2)} m²</b><small>${(m2/10000).toFixed(2)} ha</small></div>
      <div class="kpi"><label>M² construibles</label><b>${fmtInt(m2c)} m²</b><small>${m2 ? (m2c/m2*100).toFixed(0)+"% del terreno" : "—"}</small></div>
      <div class="kpi"><label>Valor total</label><b>${fmtUSD(usd)}</b><small>${fmtMXN(usd*CONFIG.USD_TO_MXN)}</small></div>
      <div class="kpi"><label>Valor disponible</label><b>${fmtUSD(usdAvail)}</b><small>${fmtMXN(usdAvail*CONFIG.USD_TO_MXN)}</small></div>
      <div class="kpi"><label>Valor colocado</label><b>${fmtUSD(usdPlaced)}</b><small>reservado + vendido · ${pct(usdPlaced, usd)}</small></div>
      <div class="kpi"><label>Vendidos</label><b>${pct(st.vendido)}</b><small>${st.vendido} lotes</small></div>
      <div class="kpi"><label>Reservados</label><b>${pct(st.reservado)}</b><small>${st.reservado} lotes</small></div>
      <div class="kpi"><label>Disponibles</label><b>${pct(st.disponible)}</b><small>${st.disponible} lotes</small></div>
      <div class="kpi"><label>Lote promedio</label><b>${fmtInt(avgArea)} m²</b><small>${fmtInt(minA)} – ${fmtInt(maxA)} m²</small></div>
      <div class="kpi"><label>Precio promedio</label><b>${fmtUSD(avgPrice)}</b><small>${fmtUSD(minP)} – ${fmtUSD(maxP)}</small></div>
      <div class="kpi"><label>Precio por m²</label><b>${fmtUSD(ppm2)}</b><small>${fmtMXN(ppm2*CONFIG.USD_TO_MXN)}</small></div>
    </div>
    <div class="rp-card">${shot("none", "Vista general del masterplan (planta)")}</div>
    <h2 class="sec">Lotes por estado</h2>
    <div class="rp-grid"><div class="rp-card">${shot("status", "Planta por estado: verde disponible · dorado reservado · rojo vendido")}</div>
      <div class="rp-card"><div class="chart-wrap"><canvas id="rcStatus"></canvas></div>
        <table class="rt" style="margin-top:14px"><tr><th>Estado</th><th class="num">Lotes</th><th class="num">%</th><th class="num">m²</th><th class="num">Valor</th></tr>
        ${["disponible","reservado","vendido"].map(s => { const ls = lots.filter(l => l.status === s); return `<tr><td><span class="dot" style="background:${CONFIG.STATUS_COLORS[s]}"></span>${s.toUpperCase()}</td><td class="num">${ls.length}</td><td class="num">${pct(ls.length)}</td><td class="num">${fmtInt(sum(ls,l=>l.area))}</td><td class="num">${fmtUSD(sum(ls,l=>l.usd))}</td></tr>`; }).join("")}</table>
        <div class="bar"><i style="width:${pct(st.disponible)};background:${CONFIG.STATUS_COLORS.disponible}"></i><i style="width:${pct(st.reservado)};background:${CONFIG.STATUS_COLORS.reservado}"></i><i style="width:${pct(st.vendido)};background:${CONFIG.STATUS_COLORS.vendido}"></i></div></div></div>
    <h2 class="sec">Lotes por superficie</h2>
    <div class="rp-grid"><div class="rp-card">${shot("area", "Planta por categoría de superficie")}</div>
      <div class="rp-card"><div class="chart-wrap"><canvas id="rcArea"></canvas></div>
        <table class="rt" style="margin-top:14px"><tr><th>Categoría</th><th class="num">Lotes</th><th class="num">%</th><th class="num">Disp.</th><th class="num">Valor</th></tr>
        ${ar.map(c => { const ls = lots.filter(l => l.area >= c.min && l.area <= c.max); return `<tr><td><span class="dot" style="background:${c.color}"></span>${c.label} m²</td><td class="num">${c.count}</td><td class="num">${pct(c.count)}</td><td class="num">${ls.filter(l=>l.status==="disponible").length}</td><td class="num">${fmtUSD(sum(ls,l=>l.usd))}</td></tr>`; }).join("")}</table></div></div>
    <h2 class="sec">Información por cluster</h2>
    <div class="rp-card">${shot("cluster", "Planta con cada cluster (serie A, B, C…) en un tono de verde distinto")}</div>
    <div class="rp-card"><table class="rt"><tr><th>Cluster</th><th class="num">Lotes</th><th class="num">Disp.</th><th class="num">Res.</th><th class="num">Vend.</th><th class="num">Colocación</th><th class="num">m² lotes</th><th class="num">m² construibles</th><th class="num">Valor total</th><th class="num">Valor disponible</th></tr>
      ${Object.keys(series).sort().map(k => { const s = series[k]; return `<tr><td><span class="dot" style="background:${clusterColorMap[k]||"#888"}"></span>Cluster ${k}</td><td class="num">${s.n}</td><td class="num">${s.disp}</td><td class="num">${s.res}</td><td class="num">${s.ven}</td><td class="num">${(100 - s.disp/s.n*100).toFixed(0)}%</td><td class="num">${fmtInt(s.m2)}</td><td class="num">${fmtInt(s.m2c)}</td><td class="num">${fmtUSD(s.usd)}</td><td class="num">${fmtUSD(s.usdDisp)}</td></tr>`; }).join("")}</table></div>
    <h2 class="sec">Amenidades</h2>
    <div class="rp-grid"><div class="rp-card">${shot("amenities", "Planta con las amenidades resaltadas en azul")}</div>
      <div class="rp-card"><div class="kpis" style="grid-template-columns:1fr 1fr"><div class="kpi"><label>Amenidades</label><b>${amen.length}</b></div><div class="kpi"><label>Superficie amenidades</label><b>${fmtInt(sum(amen, a => a.m2 || 0))} m²</b></div></div></div></div>
    <div class="rp-card"><table class="rt"><tr><th></th><th>Amenidad</th><th class="num">m²</th><th>Descripción</th></tr>
      ${amen.sort((a,b)=>a.name.localeCompare(b.name)).map(a => `<tr><td><img class="th" src="${a.img}" alt="" onerror="this.style.display='none'"></td><td><b>${a.name.toUpperCase()}</b></td><td class="num">${a.m2 ? fmtInt(a.m2) : "—"}</td><td style="color:#5a635c">${a.desc || "—"}</td></tr>`).join("") || "<tr><td colspan=4>Sin amenidades en el modelo</td></tr>"}</table></div>
    <h2 class="sec">Estrategias del proyecto</h2>
    <div class="strat-list">${CONFIG.STRATEGIES.map(s => `<div class="strat"><span class="tile" style="background:${s.color}">${ICONS[s.icon]}</span><div><b>${s.name}</b><p>${s.summary}</p></div></div>`).join("")}</div>
    <h2 class="sec">Inventario detallado</h2>
    <div class="rp-card"><table class="rt"><tr><th>Lote</th><th>Cluster</th><th class="num">Área m²</th><th class="num">Construible m²</th><th class="num">USD</th><th class="num">MXN</th><th>Estado</th></tr>
      ${rowsAll.map(l => `<tr><td>${l.index}</td><td><span class="dot" style="background:${clusterColorMap[l.series]||"#888"}"></span>${l.series}</td><td class="num">${fmtInt(l.area)}</td><td class="num">${fmtInt(l.construible)}</td><td class="num">${l.usd ? fmtUSD(l.usd) : "—"}</td><td class="num">${l.usd ? fmtMXN(l.mxn) : "—"}</td><td><span class="dot" style="background:${CONFIG.STATUS_COLORS[l.status]}"></span>${l.status.toUpperCase()}</td></tr>`).join("")}</table></div>
    <div class="rp-foot">${CONFIG.PROJECT} · Reporte confidencial generado automáticamente. Precios en MXN calculados al tipo de cambio configurado.</div>`;
  $("report").classList.add("show");
  $("reportClose").onclick = () => { $("report").classList.remove("show"); reportCharts.forEach(c => c.destroy()); reportCharts = []; };
  Chart.defaults.font.family = CONFIG.FONT.text.family; Chart.defaults.color = "#4b524d";
  reportCharts.push(new Chart($("rcArea"), { type:"bar", data:{ labels:ar.map(c=>c.label), datasets:[{ data:ar.map(c=>c.count), backgroundColor:ar.map(c=>c.color), borderRadius:8 }] }, options:{ responsive:true, maintainAspectRatio:false, animation:false, plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true, ticks:{precision:0}}, x:{grid:{display:false}} } } }));

}

  $("smallLogos").innerHTML = CONFIG.SMALL_LOGOS.map(l => `<a href="${l.href}" target="_blank" rel="noopener"><img class="smallLogo" src="${l.src}" alt="${l.alt}"></a>`).join("");

/* ══════════════════════════════════════════════════════════════════════
   BOOTSTRAP — verify libraries, load fallbacks, then start
   ══════════════════════════════════════════════════════════════════════ */
(function(){
  const deps = [
    { test:() => typeof mapboxgl !== "undefined", css:"https://cdn.jsdelivr.net/npm/mapbox-gl@3.16.0/dist/mapbox-gl.css", src:"https://cdn.jsdelivr.net/npm/mapbox-gl@3.16.0/dist/mapbox-gl.js", name:"Mapbox GL JS" },
    { test:() => typeof Threebox !== "undefined", css:"https://unpkg.com/threebox-plugin@2.2.7/dist/threebox.css", src:"https://unpkg.com/threebox-plugin@2.2.7/dist/threebox.min.js", name:"Threebox" },
    { test:() => typeof scrollama !== "undefined", src:"https://cdn.jsdelivr.net/npm/scrollama@3/build/scrollama.min.js", name:"Scrollama", optional:true },
    { test:() => typeof Chart !== "undefined", src:"https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js", name:"Chart.js" }
  ];
  const msg = t => { const l = document.getElementById("loader"); if (l){ l.classList.remove("hide"); l.textContent = t; } };
  const load = d => new Promise(res => { if (d.test()) return res(true);
    msg("CARGANDO " + d.name.toUpperCase() + " (CDN alterno)…");
    if (d.css){ const c = document.createElement("link"); c.rel = "stylesheet"; c.href = d.css; document.head.appendChild(c); }
    const sc = document.createElement("script"); sc.src = d.src; sc.onload = () => res(d.test()); sc.onerror = () => res(false); document.head.appendChild(sc); });
  (async () => {
    for (const d of deps){ const ok = await load(d); if (!ok && !d.optional){ msg("NO SE PUDO CARGAR " + d.name.toUpperCase() + " — revisa la conexión a internet o un bloqueador de contenido"); return; } }
    try { startApp(); } catch(e){ console.error(e); msg("ERROR: " + e.message); }
  })();
})();
